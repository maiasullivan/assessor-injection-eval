[project]
name = "assessor-eval"
version = "0.1.0"
description = "Can you prompt-inject an AI assessor? An Inspect evaluation."
readme = "README.md"
authors = [
    { name = "maiasullivan", email = "maiasullivan04@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.8.0",
    "inspect-ai>=0.3.289",
    "matplotlib>=3.11.2",
    "openai>=3.51.0",
    "pandas>=3.1.1",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
cv = [
    "datasets>=5.2.0",
]
dev = [
    "pytest>=9.2.0",
]
whitebox = [
    "accelerate>=1.15.0",
    "scikit-learn>=1.9.1",
    "torch>=2.15.0",
    "transformers>=5.23.0",
]
